# Native speech-dispatcher generic backend using installed eSpeak NG voices.
# An explicit desktop-sized inventory; no browser API overrides or fake voices.
Debug 0
GenericExecuteSynth "printf %s '$DATA' | /usr/bin/espeak-ng -v '$VOICE' -s $RATE -p $PITCH -a $VOLUME --stdin --stdout | /usr/bin/paplay"
GenericCmdDependency "espeak-ng"
GenericCmdDependency "paplay"
GenericRateAdd 175
GenericRateMultiply 1.25
GenericPitchAdd 50
GenericPitchMultiply 0.5
GenericVolumeAdd 100
GenericVolumeMultiply 1
GenericLanguage "en-us" "en-us" "utf-8"
GenericLanguage "en-gb" "en-gb" "utf-8"
GenericLanguage "en-gb-scotland" "en-gb-scotland" "utf-8"
GenericLanguage "es" "es" "utf-8"
GenericLanguage "fr-fr" "fr-fr" "utf-8"
GenericLanguage "de" "de" "utf-8"
GenericLanguage "it" "it" "utf-8"
GenericLanguage "pt-br" "pt-br" "utf-8"
GenericLanguage "nl" "nl" "utf-8"
GenericLanguage "hi" "hi" "utf-8"
GenericLanguage "cmn" "cmn" "utf-8"
AddVoice "en-us" "MALE1" "en-us"
AddVoice "en-us" "MALE2" "en-us+m2"
AddVoice "en-us" "FEMALE1" "en-us+f2"
AddVoice "en-us" "FEMALE2" "en-us+f3"
AddVoice "en-gb" "MALE1" "en-gb"
AddVoice "en-gb" "MALE2" "en-gb+m2"
AddVoice "en-gb" "FEMALE1" "en-gb+f2"
AddVoice "en-gb" "FEMALE2" "en-gb+f3"
AddVoice "en-gb-scotland" "MALE1" "en-gb-scotland"
AddVoice "en-gb-scotland" "MALE2" "en-gb-scotland+m2"
AddVoice "en-gb-scotland" "FEMALE1" "en-gb-scotland+f2"
AddVoice "en-gb-scotland" "FEMALE2" "en-gb-scotland+f3"
AddVoice "es" "MALE1" "es"
AddVoice "es" "FEMALE1" "es+f2"
AddVoice "fr-fr" "MALE1" "fr-fr"
AddVoice "fr-fr" "FEMALE1" "fr-fr+f2"
AddVoice "de" "MALE1" "de"
AddVoice "de" "FEMALE1" "de+f2"
AddVoice "it" "MALE1" "it"
AddVoice "it" "FEMALE1" "it+f2"
AddVoice "pt-br" "MALE1" "pt-br"
AddVoice "pt-br" "FEMALE1" "pt-br+f2"
AddVoice "nl" "MALE1" "nl"
AddVoice "nl" "FEMALE1" "nl+f2"
AddVoice "hi" "MALE1" "hi"
AddVoice "hi" "FEMALE1" "hi+f2"
AddVoice "cmn" "MALE1" "cmn"
AddVoice "cmn" "FEMALE1" "cmn+f2"
DefaultVoice "en-us"
